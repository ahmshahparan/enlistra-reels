niche: classic_comedy
brand: "Enlistra Reels"          # shown on the title card and caption sign-off

source:
  provider: internet_archive
  # Public domain rules: US works published before 1929, or items carrying a
  # Creative Commons / public domain license URL. Anything else is skipped.
  pd_year_cutoff: 1929
  queries:
    - 'creator:(chaplin) AND mediatype:movies'
    - 'title:(chaplin) AND mediatype:movies'
    - 'subject:(charlie chaplin) AND mediatype:movies'
    - 'creator:(keaton) AND mediatype:movies'
    - 'subject:(silent comedy) AND mediatype:movies'
  max_download_mb: 1500
  min_height: 360           # skip prints below this; sharper copies are preferred automatically
  require_identified: true   # skip uploads with no year that the model cannot identify (compilations)
  prefer_formats: [mp4, mkv, mov, m4v, mpeg, ogv]

select:
  clip_seconds_min: 24   # candidate window size; the vision step cuts 8 to 25 s inside it
  clip_seconds_max: 36
  candidates_per_film: 14
  max_rounds: 3          # regenerate rounds when the critic rejects a pick
  reels_per_film: 2
  # weights for the heuristic score (0..1 each, summed)
  w_motion: 0.5
  w_cuts: 0.3
  w_dialogue: 0.2      # only matters when a transcript exists
  use_vision: true     # Claude looks at frames (needs ANTHROPIC_API_KEY); else text ranker
  use_llm_rank: true   # LLM picks from candidates and writes hooks; falls back to heuristic on error
  llm_backend: ollama  # ollama (local, free) or anthropic (needs ANTHROPIC_API_KEY)
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  anthropic_model: claude-sonnet-5-5

edit:
  width: 1080
  height: 1920
  fps: 30
  font: /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
  title_card_seconds: 1.2
  crop_mode: blur_bg    # blur_bg = keep full frame over blurred fill; center = hard 9:16 crop
  speed: 1.08               # gentle speed-up; silent comedy reads well a touch fast
  music_dir: assets/music   # public domain rags, fetched by enlistra/assets.py
  music_volume: 0.8
  sfx_dir: assets/sfx       # CC0 hits, fetched by enlistra/assets.py
  sfx_volume: 1.0
  voice: assets/voices/en_US-ryan-high.onnx   # Piper voice; see assets/voices
  voice_speed: 0.97
  narration_start: 0.3
  style: cold
  styles: [cold_narrated]   # every Short is narrated: the original commentary YouTube looks for
  watermark: "@enlistra_reels"

critic:
  use_judge: true      # Claude scores the finished reel; gates run regardless
  target_score: 3.5   # regenerate below this while rounds remain
  accept_score: 3.0   # after the last round, keep reels at or above this
  min_len: 8
  max_len: 26
  voice_gap: 0.5       # seconds the narration must end before the payoff

post:
  mode: publish           # draft = write manifest + Typefully draft, never auto-publish; publish = schedule
  typefully_enabled: true
  require_approval: true  # reels wait in the dashboard queue until the owner approves...
  auto_approve_score: 4   # ...unless the critic scores them 4/5 or higher with no failed gates (owner decision, Oct 26 2026)
  daily_post_cap: 3       # uploads per channel per day (YouTube API quota: ~6 uploads/day across all channels)
  platforms: [youtube_shorts]   # TikTok and Instagram are posted from the phone queue in the dashboard
  hashtags: ["#charliechaplin", "#silentfilm", "#comedy", "#chaplin", "#funny", "#shorts"]
  yt_tags: ["charlie chaplin", "chaplin", "charlie chaplin comedy", "silent film", "silent comedy", "classic comedy",
            "slapstick", "funny old movies", "the tramp", "black and white movies", "comedy shorts", "funny"]
  yt_category: "23"       # Comedy
  playlist: "Charlie Chaplin Shorts"
  desc_footer: |
    New silent comedy Shorts every day. Subscribe: https://www.youtube.com/@enlistra_reels?sub_confirmation=1

paths:
  work: work
  state: work/state.jsonl
